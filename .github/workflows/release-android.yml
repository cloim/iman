name: release-android

# v1.2.3 태그를 푸시하면 서명된 APK 와 latest.json 을 GitHub Release 에 올린다.
# 앱은 releases/latest/download/latest.json 을 읽어 직접 업데이트한다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: version
        id: v
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
      - name: web build and sync
        working-directory: apps/web
        run: pnpm exec vite build && pnpm exec cap sync android
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/web/android/app/google-services.json
          fi
      - name: keystore
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > "$RUNNER_TEMP/iman.jks"
      - name: assemble
        working-directory: apps/web/android
        env:
          IMAN_KEYSTORE: ${{ runner.temp }}/iman.jks
          IMAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IMAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IMAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IMAN_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          IMAN_VERSION_NAME: ${{ steps.v.outputs.name }}
          IMAN_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_SUPPORTED: ${{ vars.MIN_SUPPORTED_VERSION_CODE || '0' }}
        run: |
          apk="iman-${{ steps.v.outputs.name }}.apk"
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          notes=$(git log -1 --format=%B "$GITHUB_REF_NAME")
          jq -n --arg name "${{ steps.v.outputs.name }}" --argjson code ${{ steps.v.outputs.code }} \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$apk" \
            --arg sha "$sha" --argjson min "$MIN_SUPPORTED" --arg notes "$notes" \
            '{versionName: $name, versionCode: $code, apkUrl: $url, sha256: $sha, minSupported: $min, notes: $notes}' > latest.json
          gh release create "$GITHUB_REF_NAME" "$apk" latest.json --title "이만 ${{ steps.v.outputs.name }}" --notes "$notes"
